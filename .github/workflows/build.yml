name: Build IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: List sources
        run: |
          ls -la
          find . -name "*.m" -o -name "*.h" | sort

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project WQApp.xcodeproj \
            -scheme WQApp \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build 2>&1 | tail -80

      - name: Package IPA
        run: |
          set -e
          APP=$(find ./build -name "WQApp.app" -type d | head -1)
          echo "APP=$APP"
          if [ -z "$APP" ]; then
            echo "::error::WQApp.app not produced"
            find ./build -maxdepth 5 -type d | head -40
            exit 1
          fi
          ls -la "$APP"
          file "$APP/WQApp"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r WQApp-unsigned.ipa Payload
          ls -lh WQApp-unsigned.ipa

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: WQApp-ipa
          path: WQApp-unsigned.ipa
          retention-days: 30

      - name: Fail log
        if: failure()
        run: |
          echo "=== build dir ==="
          find ./build -name "*.log" -o -name "*.xcactivitylog" 2>/dev/null | head
          echo "=== full rebuild tail ==="
          xcodebuild -project WQApp.xcodeproj -scheme WQApp -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -120